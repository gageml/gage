[package]
name = "gage-scan"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
codespan-reporting = "0.13.1"
gage-core = { path = "../gage-core" }
gage-registry = { path = "../gage-registry" }
gage-runtime = { path = "../gage-runtime" }
gage-session = { path = "../gage-session" }
gage-store = { path = "../gage-store" }
serde = { workspace = true }
serde_json = { workspace = true }
rune = { git = "https://github.com/gar1t/rune.git", branch = "gage" }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
async-trait = { workspace = true }
libtest-mimic = "0.8"
datafusion = { workspace = true }
gage-claude = { path = "../gage-claude" }
gage-query = { path = "../gage-query" }
tempfile = { workspace = true }

[[test]]
name = "rune"
harness = false

[lints]
workspace = true
