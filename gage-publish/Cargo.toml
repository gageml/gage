[package]
name = "gage-publish"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
gage-core = { path = "../gage-core" }
gage-registry = { path = "../gage-registry" }
gage-runtime = { path = "../gage-runtime" }
gage-session = { path = "../gage-session" }
gage-store = { path = "../gage-store" }
regex = { workspace = true }
rune = { git = "https://github.com/gar1t/rune.git", branch = "gage" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tracing = { workspace = true }
jsonc-parser = { version = "0.32.4", features = ["serde", "serde_json"] }
jsonschema = { version = "0.58", default-features = false }

[dev-dependencies]
gage-claude = { path = "../gage-claude" }
tempfile = { workspace = true }

[lints]
workspace = true
