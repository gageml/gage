[[test]] # --------------------------------------------------------

name = "list-issues"

prompt = "List the open issues with their name and title"

db_init = """
INSERT INTO scan (id, created) VALUES ('s1', 0);
INSERT INTO scan_task (scan_id, scanner_name, scanner_version, task_name, status)
  VALUES ('s1', 'hidden-thinking', '1', 'find', 'completed');
INSERT INTO issue (id, name, title, status, created, author) VALUES
  ('i-open-1', 'thinking.empty', 'Thinking blocks hidden in recent session',
   'open', 1000, 'scanner:hidden-thinking');
INSERT INTO issue (id, name, title, status, status_reason, created, author) VALUES
  ('i-fixed-1', 'thinking.empty.past', 'Fixed earlier finding',
   'closed', 'completed', 500, 'scanner:hidden-thinking');
"""

claude.permissions.allow = ["mcp__plugin_gage_gage__Query"]

# Turns:
#
# 1. ToolSearch
# 2. Query (may take two)
# 4. Reply
expect.max_turns = 4

# Match and title and name
expect.match_all = ["Thinking blocks hidden", "thinking.empty"]

[[test]] # --------------------------------------------------------

name = "empty-issues"
prompt = "How many open issues do I have?"
claude.permissions.allow = ["mcp__plugin_gage_gage__Query"]

# Turns:
#
# 1. ToolSearch
# 2. Query
# 3. Reply
# +1 for an optional query-skill load
expect.max_turns = 4

# Expect no issues
expect.match = "(?i)no.*open.*issues|0 open|zero"
