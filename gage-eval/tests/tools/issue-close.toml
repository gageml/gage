[[test]] # --------------------------------------------------------

name = "close-completed"

prompt = """
List the open issues and close the one about thinking blocks. Mark it
completed with message 'Set thinking display to summarized'.
"""

db_init = """
INSERT INTO scan (id, created) VALUES ('s1', 0);
INSERT INTO scan_task (scan_id, scanner_name, scanner_version, task_name, status)
  VALUES ('s1', 'hidden-thinking', '1', 'find', 'completed');
INSERT INTO issue (id, name, title, status, created, author)
  VALUES ('i-open-1', 'thinking.empty',
          'Thinking blocks hidden in recent session',
          'open', 1000, 'scanner:hidden-thinking');
"""

claude.permissions.allow = [
  "mcp__plugin_gage_gage__Query",
  "mcp__plugin_gage_gage__IssueUpdate",
]

# Turns:
#
# 1. ToolSearch
# 2. Query
# 3. IssueUpdate
# 4. Reply
expect.max_turns = 4

# Confirm issue closed with reason 'completed' and the status event
# carries the message
expect.db_rows = ["""
SELECT 1 FROM issue
WHERE id = 'i-open-1'
  AND status = 'closed'
  AND status_reason = 'completed'
""", """
SELECT 1 FROM issue_event
WHERE issue_id = 'i-open-1'
  AND type = 'status'
  AND json_extract(metadata, '$.message') = 'Set thinking display to summarized'
"""]

