name = "issue-description"

prompt = """
What setting does the open issue recommend changing?
"""

db_init = """
INSERT INTO scan (id, created) VALUES ('s1', 0);
INSERT INTO scan_task (scan_id, scanner_name, scanner_version, task_name, status)
  VALUES ('s1', 'hidden-thinking', '1', 'find', 'completed');
INSERT INTO issue (id, name, title, description, status, created, author)
  VALUES ('i-open-1', 'thinking.empty',
          'Thinking blocks hidden in recent session',
          'Set showThinkingSummaries to true in settings.json.',
          'open', 1000, 'scanner:hidden-thinking');
"""

claude.permissions.allow = ["mcp__plugin_gage_gage__Query"]

# Turns:
#
# 1. ToolSearch
# 2. Query (list open issues)
# 3. Query (issue detail)
# 4. Reply
expect.max_turns = 4

# Setting referenced in issue
expect.match = "showThinkingSummaries"
