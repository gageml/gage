[package]
name = "gage-tui"
version.workspace = true
edition.workspace = true

[dependencies]
datafusion = { workspace = true }
gage-claude = { path = "../gage-claude" }
gage-core = { path = "../gage-core" }
gage-db = { path = "../gage-db" }
gage-index = { path = "../gage-index" }
gage-query = { path = "../gage-query" }
rand = "0.9"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde_json = { workspace = true }
serde_yml = "0.0.12"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-linebreak = "0.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
