[package]
name = "gage-pi"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
gage-core = { path = "../gage-core" }
gage-corpus = { path = "../gage-corpus" }
gage-plugin = { path = "../gage-plugin" }
gage-session = { path = "../gage-session" }
libc = "0.2"
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "process", "time", "rt", "io-util"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
gage-session = { path = "../gage-session", features = ["test-util"] }
gage-store = { path = "../gage-store" }
jsonschema = { version = "0.58", default-features = false }
tempfile = { workspace = true }

[lints]
workspace = true
