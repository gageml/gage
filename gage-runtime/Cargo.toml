[package]
name = "gage-runtime"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true }
datafusion = { workspace = true }
futures = { workspace = true }
gage-core = { path = "../gage-core" }
gage-mcp = { path = "../gage-mcp" }
gage-query2 = { path = "../gage-query2" }
regex = { workspace = true }
gage-session = { path = "../gage-session" }
minijinja = "2"
gage-store = { path = "../gage-store" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
percent-encoding = { workspace = true }
rune = { git = "https://github.com/gar1t/rune.git", branch = "gage" }
rune-modules = { git = "https://github.com/gar1t/rune.git", branch = "gage", features = ["time", "rand", "thread_rng"] }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
