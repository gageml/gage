[package]
name = "gage-runtime"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
datafusion = { workspace = true }
gage-agent = { path = "../gage-agent" }
gage-claude = { path = "../gage-claude" }
gage-core = { path = "../gage-core" }
gage-db = { path = "../gage-db" }
gage-query = { path = "../gage-query" }
gage-registry = { path = "../gage-registry" }
minijinja = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rune = { git = "https://github.com/gar1t/rune.git", branch = "gage" }
rune-modules = { git = "https://github.com/gar1t/rune.git", branch = "gage", features = ["time", "rand", "thread_rng"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
