[package]
name = "gage-session"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
datafusion = { workspace = true }
indexmap = { version = "2", features = ["serde"] }
regex = { workspace = true }
serde = { workspace = true }
# `float_roundtrip` parses a float to the nearest double. Without it a
# float of 16 or more digits can parse one step off, and its value as
# a `serde_json::Value` prints with a different last digit than the
# session has. `raw_value` writes an entry's number as its own text.
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
serde_json_path = "0.7"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
# Exposes `progress::recorder` for tests of progress-reporting code
test-util = ["dep:tracing-subscriber"]

[lints]
workspace = true
