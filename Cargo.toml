[workspace]
members = [
    "gage-bench",
    "gage-cli",
    "gage-claude",
    "gage-core",
    "gage-log",
    "gage-lsp",
    "gage-mcp",
    "gage-query",
    "gage-registry",
    "gage-runtime",
    "gage-scan",
    "gage-session",
    "gage-store",
    "gage-tui",
]
resolver = "2"

[workspace.package]
version = "0.2.0-rc.1"
edition = "2024"

[workspace.dependencies]
datafusion = { version = "52.4.0", default-features = false, features = [
    "parquet",
    "sql",
    "nested_expressions",
    "datetime_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "crypto_expressions",
    "encoding_expressions",
    "recursive_protection",
] }
aho-corasick = "1"
arrow = "57.3.0"
async-trait = "0.1"
fs4 = { version = "1.1", features = ["sync"] }
futures = "0.3"
chrono = "0.4"
clap = { version = "4.6.0", features = ["derive"] }
console = "0.16.2"
indicatif = "0.18"
percent-encoding = "2.3"
num_cpus = "1"
regex = "1"
rmp-serde = "1.3"
rust-embed = "8"
rustyline = "17.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = { version = "0.9.34", default-features = false }
tabled = { version = "0.22", features = ["ansi"] }
tempfile = "3"
tokio = "1.50.0"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }
twox-hash = { version = "2", default-features = false, features = [
    "xxhash3_64",
] }

[workspace.lints.clippy]
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
indexing_slicing = "warn"

# Dependencies are built optimized in the dev profile. The hot paths
# of a session add (zlib, SHA-1, JSON parsing) run in dependency code:
# compressing the 874 MB session corpus took 69 s unoptimized and 5 s
# at opt-level 3. Workspace crates stay unoptimized and incremental.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
panic = "abort"

# Opt-in profile for shipping a minimal binary. Slow to build.
[profile.release-small]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
debug = false
