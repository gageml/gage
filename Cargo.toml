[workspace]
members = [
    "gage-agent",
    "gage-bench",
    "gage-cli",
    "gage-claude",
    "gage-core",
    "gage-db",
    "gage-eval",
    "gage-index",
    "gage-lsp",
    "gage-mcp",
    "gage-query",
    "gage-scan",
    "gage-sync",
    "gage-tui",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
datafusion = { version = "52.4.0", default-features = false, features = [
    "parquet",
    "sql",
    "nested_expressions",
    "datetime_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
    "crypto_expressions",
    "encoding_expressions",
    "recursive_protection",
] }
arrow = "57.3.0"
async-trait = "0.1"
fs4 = { version = "1.1", features = ["sync"] }
futures = "0.3"
tantivy = "0.26"
chrono = "0.4"
clap = { version = "4.6.0", features = ["derive"] }
cliclack = "0.3"
console = "0.16.2"
humantime = "2"
indicatif = "0.18"
num_cpus = "1"
regex = "1"
rmp-serde = "1.3"
rust-embed = "8"
rustyline = "17.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = { version = "0.9.34", default-features = false }
tabled = { version = "0.20", features = ["ansi"] }
tempfile = "3"
tokio = "1.50.0"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
datafusion-table-providers = { git = "https://github.com/gar1t/datafusion-table-providers", branch = "gar1t-dev-v0.10.1" }

[patch."https://github.com/gar1t/rune.git"]
rune = { path = "../rune/crates/rune" }
rune-modules = { path = "../rune/crates/rune-modules" }

[workspace.lints.clippy]
let_underscore_must_use = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
indexing_slicing = "warn"

[profile.release]
debug = "line-tables-only"
panic = "abort"

# Opt-in profile for shipping a minimal binary. Slow to build.
[profile.release-small]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
debug = false
