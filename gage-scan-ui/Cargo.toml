[package]
name = "gage-scan-ui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "gage-scan-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { workspace = true }
console = { workspace = true }
gage-claude = { path = "../gage-claude" }
gage-core = { path = "../gage-core" }
gage-db = { path = "../gage-db" }
gage-query = { path = "../gage-query" }
gage-scan = { path = "../gage-scan" }
indicatif = { workspace = true }
num_cpus = { workspace = true }
ratatui = "0.29"
crossterm = "0.28"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = { workspace = true }

[lints.clippy]
# Prototype harness: terminal teardown, channel sends, and println on
# MultiProgress are intentionally best-effort. Layout::split returns the
# exact number of chunks requested so indexing is safe by construction.
let_underscore_must_use = "allow"
unused_result_ok = "allow"
indexing_slicing = "allow"
map_err_ignore = "warn"
