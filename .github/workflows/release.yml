# Create a release with available built artifacts for the current crate
# version.
#
# Artifacts are generated from build.yml (pushes to build branch). Once
# all build targets are successfully uploaded, a push to the release
# branch signals that Gage is ready for a release.
#
# Releases are keyed by crate version.
#
# New releases include release notes from CHANGELOG.md under the section
# header `[{version}]`.

name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PKGNAME: gage
  # Every target that must have a built artifact for the release to
  # proceed. Keep in sync with the build matrix in build.yml.
  TARGETS: x86_64-unknown-linux-gnu aarch64-apple-darwin

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Crate version
        id: version
        uses: ./.github/actions/crate-version

      - name: Artifacts
        # For each target, select the artifact named exactly
        # ${PKGNAME}-${VERSION}-${target} (regardless of which Build run
        # produced it) and extract its tarball into dist/. If a name
        # appears in more than one run, the highest id (most recent)
        # wins. A missing target fails the release: a partial set of
        # binaries is never released.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          all="$(mktemp)"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[]]' > "$all"
          mkdir -p dist
          for target in $TARGETS; do
            name="${PKGNAME}-${VERSION}-${target}"
            id="$(jq -r --arg n "$name" \
              '[.[] | select(.name == $n)] | max_by(.id) | .id // empty' "$all")"
            if [ -z "$id" ]; then
              echo "::error::Missing artifact $name" >&2
              exit 1
            fi
            zip="$(mktemp --suffix=.zip)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$zip"
            unzip -j -o "$zip" -d dist/
            rm -f "$zip"
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Release notes
        # Release body is the CHANGELOG.md section for the release
        # version. Content consists of the lines between the `##
        # ...VERSION...` heading and the next `## ` heading.
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes_file="$(mktemp)"
          awk -v ver="$VERSION" '
            /^## / {
              if (in_section) exit
              if (index($0, ver) > 0) { in_section = 1; next }
            }
            in_section { print }
          ' CHANGELOG.md > "$notes_file"
          # Trim leading/trailing blank lines; fail if nothing was captured.
          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::No CHANGELOG.md section found for $VERSION." \
                 "Add a '## [$VERSION]' heading with notes before releasing." >&2
            exit 1
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          # A semver prerelease carries a suffix (e.g. 0.0.1-pre.2).
          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE" \
            $prerelease \
            dist/*
