[package]
name = "gage-sync"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
gage-core = { path = "../gage-core" }
gage-db = { path = "../gage-db" }
async-trait = { workspace = true }
futures = { workspace = true }
object_store = { version = "0.13", features = ["aws"] }
serde = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt-multi-thread", "macros"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
walkdir = "2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
