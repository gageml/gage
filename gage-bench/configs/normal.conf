# gage-bench store profile: the defaults, a few minutes, the scale baselines are kept at
#
# Run: cargo run -p gage-bench --release -- store @gage-bench/configs/normal.conf
# Any option typed after the @file overrides the file's value.
--notes=2000
--note-bytes=256
--sessions=200
--session-kb=64
--large-sessions=2
--large-kb=5120
--datasets=10
--dataset-size=20
--edit-pct=10
--delete-pct=5
--iterations=10
--random-reads=500
--seed=1
