# gage-bench store profile: smoke test, a few seconds
#
# Run: cargo run -p gage-bench --release -- store @gage-bench/configs/smoke.conf
# Any option typed after the @file overrides the file's value.
--notes=200
--note-bytes=256
--sessions=20
--session-kb=64
--large-sessions=1
--large-kb=1024
--datasets=3
--dataset-size=5
--edit-pct=10
--delete-pct=5
--iterations=3
--random-reads=50
--seed=1
