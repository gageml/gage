# gage-bench store profile: tens of minutes, for scale questions and the tail
#
# Run: cargo run -p gage-bench --release -- store @gage-bench/configs/heavy.conf
# Any option typed after the @file overrides the file's value.
--notes=20000
--note-bytes=256
--sessions=2000
--session-kb=64
--large-sessions=5
--large-kb=20480
--datasets=50
--dataset-size=40
--edit-pct=10
--delete-pct=5
--iterations=20
--random-reads=2000
--seed=1
